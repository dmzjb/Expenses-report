[project]
name = "expense_report"
version = "0.1.0"
description = "Expense report"
readme = "README.md"
authors = [
    { name = "dmzjb", email = "kubadomowicz2@wp.pl" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
project2 = "project2:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
